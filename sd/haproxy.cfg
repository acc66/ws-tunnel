frontend bhk
  bind :::33399
  mode http
  # 反探测防护（共用 mmk 的追踪表）
  tcp-request connection track-sc0 src table mmk
  acl blacklisted src -f /etc/haproxy/blacklist.lst
  acl is_scanner sc0_get_gpc0 gt 0
  acl is_websocket hdr(Upgrade) -i websocket
  acl valid_path path /mm
  http-request deny deny_status 403 if blacklisted
  http-request deny deny_status 403 if is_scanner
  http-request sc-inc-gpc0(0) if !valid_path
  use_backend honeypot if !valid_path
  use_backend honeypot if valid_path !is_websocket
  default_backend bhk3
backend bhk3
