# =============================================
# 蜜罐后端 - 探测器看到的是 Nginx 默认欢迎页
# GFW 会认为这只是一台普通的 Web 服务器
# =============================================
backend honeypot
  mode http
  http-request return status 200 content-type "text/html; charset=utf-8" string "<!DOCTYPE html><html><head><title>Welcome to nginx!</title><style>body{width:35em;margin:0 auto;font-family:Tahoma,Verdana,Arial,sans-serif}</style></head><body><h1>Welcome to nginx!</h1><p>If you see this page, the nginx web server is successfully installed and working. Further configuration is required.</p><p>For online documentation and support please refer to <a href=\"http://nginx.org/\">nginx.org</a>.</p><p><em>Thank you for using nginx.</em></p></body></html>"

