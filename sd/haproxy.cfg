global
  log 127.0.0.1   local0           #[日志输出配置，所有日志都记录在本机，通过local0输出]
  log 127.0.0.1   local1 notice    #定义haproxy 日志级别[error warringinfo debug]
  daemon                    #以后台形式运行harpoxy
  nbthread 8                         #设置进程数量
  cpu-map auto:1/1-8 0-7            # 自动分配线程到所有核心
  pidfile /var/run/haproxy.pid
  ulimit-n 1000000                    #ulimit 的数量限制
  maxconn 200000                  #默认最大连接数,需考虑ulimit-n限制
  #chroot /usr/local/haproxy
  #tune.ssl.default-dh-param  2048
  
 #=== TCP/HTTP缓冲优化 ===
  tune.bufsize 65536                # ↑ WebSocket/视频流必备，默认16384
  tune.maxrewrite 4096              # 扩大HTTP头重写缓存
  tune.rcvbuf.client 0              # 使用系统TCP自动调优
  tune.rcvbuf.server 0
  tune.sndbuf.client 0
  tune.sndbuf.server 0
  tune.ssl.default-dh-param 2048    # SSL握手优化，防止性能退化  
  stats socket /var/lib/haproxy/stats mode 600 level admin
defaults
  log global
  mode http                  #默认的模式mode { tcp|http|health }，tcp是4层，http是7层，health只会返回OK
  retries 3                 #两次连接失败就认为是服务器不可用，也可以通过后面设置
  option abortonclose       #当服务器负载很高的时候，自动结束掉当前队列处理比较久的链接
  option redispatch
  maxconn 100000              #默认的最大连接数
  timeout connect  5000ms   #连接超时
  timeout client 50000ms    #客户端超时
  timeout server 50000ms    #服务器超时
  timeout tunnel 1h
  timeout client-fin 30s
  option http-server-close        # 开启HTTP连接关闭模式，以减少连接数和提升性能
  option forwardfor               # 添加X-Forwarded-For头部，用于记录原始IP地址
  compression algo gzip           # 启用GZIP压缩
  compression type text/html text/plain text/css application/javascript application/json  
  balance roundrobin        #设置默认负载均衡方式，轮询方式
  #balance source           #设置默认负载均衡方式，类似于nginx的ip_hash
  #balnace leastconn        #设置默认负载均衡方式，最小连接数
listen admin_stats
  bind 0.0.0.0:22888
  mode http
  option httplog
  maxconn 10
  stats refresh 30s
  stats uri /
  stats realm Haproxy
  stats auth admin:admin
  stats  admin if TRUE
resolvers mydns
    nameserver dns1 223.5.5.5:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s
    hold valid 10s
    hold obsolete 30s
###################################
#最后要空一格 低位端口haproxy:2.3.19 这个版本
###################################
frontend mmk
  bind :::20001,:::58888,:::18888,:::88,:::77,:::28888 tfo
  mode http

  # 详细日志（调试用）
  option httplog
  http-request capture req.hdr(Host) len 50
  http-request capture req.hdr(Upgrade) len 20
  http-request capture req.hdr(Connection) len 30

  # =============================================
  # 反 GFW 主动探测防护系统
  # =============================================

  # --- 第一层：IP 行为追踪表 ---
  # gpc0>0 表示该IP已被标记为扫描器
  # 2小时过期，过期后扫描器IP可重新连接（但会再次被标记）
  stick-table type ip size 500k expire 2h store gpc0
  tcp-request connection track-sc0 src

  # --- 第二层：黑名单检测 ---
  # 静态黑名单文件（需先创建：touch /etc/haproxy/blacklist.lst）
  acl blacklisted src -f /etc/haproxy/blacklist.lst
  # stick-table 中已标记的扫描器
  acl is_scanner sc0_get_gpc0 gt 0

  # --- 第三层：WebSocket 特征检测 ---
  # 真实 WS 客户端必带 Upgrade: websocket 头
  acl is_websocket hdr(Upgrade) -i websocket

  # --- 第四层：路径验证（陷阱核心）---
  # 只有 /mm 是合法路径，其他路径全部触发陷阱
  acl valid_path path /mm

  # =============================================
  # 防护执行规则（顺序很重要！）
  # =============================================

  # 规则1：已知扫描器/黑名单 → 直接拒绝
  http-request deny deny_status 403 if blacklisted
  http-request deny deny_status 403 if is_scanner

  # 规则3：路径不是 /mm → 标记IP + 送入蜜罐（明确的探测行为）
  http-request sc-inc-gpc0(0) if !valid_path

  # 规则4：路径正确但没有 WebSocket 升级头 → 只送蜜罐，不标记IP
  # 因为 Shadowrocket 等客户端可能先发普通HTTP探测，再发WS升级请求
  # 不标记IP，这样后续的真正WS连接仍然能通过

  # 规则5：不合法的请求送入蜜罐（返回 nginx 欢迎页）
  use_backend honeypot if !valid_path
  use_backend honeypot if valid_path !is_websocket

  # =============================================
  # 原有 ACL 定义（以下保持不变）
  # =============================================
  acl xg hdr_reg(host) -i xg
  acl hkt hdr_beg(host) -i hkt
  acl baidu hdr_reg(host) -i baidu
  acl apple hdr_reg(host) -i apple
  acl download hdr_beg(host) -i download.
  acl download_us1 hdr_reg(host) -i download_us1.
  acl download_us2 hdr_reg(host) -i download_us2.
  acl download_us3 hdr_reg(host) -i download_us3.
  acl download_sgp1 hdr_reg(host) -i download_sgp1.
