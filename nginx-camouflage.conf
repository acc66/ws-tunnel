# Nginx 伪装配置
# 放在 /etc/nginx/sites-available/default

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 真实的静态网站（企业官网/博客）
    root /var/www/html;
    index index.html index.htm;

    # 正常路径返回真实网站
    location / {
        try_files $uri $uri/ =404;
    }

    # 特殊路径才转发到隧道（只有知道的人才能访问）
    location /mm {
        # 验证特定 User-Agent（额外保护）
        if ($http_user_agent !~* "Mozilla/5.0.*Chrome") {
            return 404;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 常见扫描路径返回 404（不是 nginx 欢迎页）
    location ~* ^/(admin|phpmyadmin|wp-admin|login|api|.env|backup) {
        return 404;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # 免费 SSL 证书（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # WSS 隧道（HTTPS 下的 WebSocket）
    location /mm {
        if ($http_user_agent !~* "Mozilla/5.0.*Chrome") {
            return 404;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
