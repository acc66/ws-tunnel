global
  log 127.0.0.1 local0
  daemon
  nbthread 4
  pidfile /var/run/haproxy.pid
  ulimit-n 100000
  maxconn 50000

defaults
  log global
  mode tcp
  retries 3
  option tcplog
  maxconn 10000
  timeout connect 5000ms
  timeout client 1h
  timeout server 1h

# 从 A (1.1.1.1) 接收流量，转发到 C (3.3.3.3)
listen tunnel_to_c
  bind 0.0.0.0:20001
  mode tcp
  option tcplog
  balance roundrobin
  server c_server 3.3.3.3:20001 check inter 10s rise 2 fall 3

# 如果需要支持多个端口，添加更多 listen 段
listen tunnel_to_c_58888
  bind 0.0.0.0:58888
  mode tcp
  balance roundrobin
  server c_server 3.3.3.3:58888 check inter 10s rise 2 fall 3

listen tunnel_to_c_18888
  bind 0.0.0.0:18888
  mode tcp
  balance roundrobin
  server c_server 3.3.3.3:18888 check inter 10s rise 2 fall 3

# 统计页面
listen admin_stats
  bind 0.0.0.0:22888
  mode http
  stats refresh 30s
  stats uri /
  stats realm Haproxy-Tunnel-B
  stats auth admin:admin
